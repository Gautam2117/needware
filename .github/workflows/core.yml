name: Core verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.5.3
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: python3 scripts/token_guard.py run 'python3 scripts/check.py'
      - run: python3 scripts/token_guard.py run 'cargo build -p needware-wasm --target wasm32-unknown-unknown --release'
      - run: python3 scripts/token_guard.py run 'cargo run -p xtask -- contracts && git diff --exit-code -- packages/ir-types specs/application.schema.json'
      - run: python3 scripts/token_guard.py run 'cargo install wasm-bindgen-cli --version 0.2.129 --locked'
      - run: python3 scripts/token_guard.py run 'pnpm build'
      - run: python3 scripts/token_guard.py run 'pnpm exec playwright install --with-deps chromium firefox webkit'
      - run: |
          pnpm --filter @needware/web start --port 3108 > /tmp/needware-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:3108/ > /dev/null && break; sleep 1; done
          python3 scripts/token_guard.py run 'NEEDWARE_TEST_URL=http://127.0.0.1:3108 pnpm exec playwright test local-runtime.spec.ts'
      - run: python3 scripts/token_guard.py run 'cargo run -p xtask -- revision-fixture && NEEDWARE_TEST_URL=http://127.0.0.1:3108 pnpm exec playwright test revisions.spec.ts synchronized-revisions.spec.ts remix.spec.ts generation-encryption.spec.ts'
      - run: python3 scripts/token_guard.py run 'cargo run -p xtask -- controls-fixture && NEEDWARE_TEST_URL=http://127.0.0.1:3108 pnpm exec playwright test runtime-controls.spec.ts runtime-widgets.spec.ts runtime-visuals.spec.ts runtime-drafts.spec.ts offline-claim.spec.ts'
      - run: python3 scripts/token_guard.py run 'NEEDWARE_TEST_URL=http://127.0.0.1:3108 pnpm exec playwright test encrypted-sync.spec.ts vault-storage.spec.ts held-documents.spec.ts document-journal.spec.ts encrypted-library.spec.ts journal-local-state.spec.ts document-epochs.spec.ts root-epochs.spec.ts root-retained-device.spec.ts root-rotation-store.spec.ts foreign-root-cut.spec.ts'
      - run: pnpm test:compiler
        timeout-minutes: 10
      - run: python3 scripts/token_guard.py run 'pnpm bootstrap && python3 scripts/verify_local_services.py'
        timeout-minutes: 5
      - run: pnpm test:accounts
        timeout-minutes: 20
      - run: pnpm test:roots
        timeout-minutes: 20
      - run: pnpm test:revisions
        timeout-minutes: 20
      - run: pnpm test:registry
        timeout-minutes: 20
      - run: pnpm test:generation
        timeout-minutes: 20
      - run: pnpm test:billing
        timeout-minutes: 20
      - run: pnpm test:operations
        timeout-minutes: 20
      - run: pnpm test:backup
        timeout-minutes: 20
      - run: python3 scripts/token_guard.py run 'cargo run --release -p xtask -- benchmark'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-benchmark-baseline
          path: artifacts/benchmarks/
          retention-days: 14
      - if: failure()
        run: python3 scripts/browser_diagnostics.py
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-failure-evidence
          path: |
            artifacts/browser-results.json
            test-results/**/error-context.md
            test-results/**/trace.zip
            .logs/accounts-mail.log
            .logs/accounts-web.log
          retention-days: 7
