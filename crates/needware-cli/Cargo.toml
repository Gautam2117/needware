[package]
name = "needware-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
[[bin]]
name = "needware"
path = "src/main.rs"
[dependencies]
needware-ir = { path = "../needware-ir", version = "=2026.10.0" }
needware-package = { path = "../needware-package", version = "=2026.10.0" }
needware-crypto = { path = "../needware-crypto", version = "=2026.10.0" }
needware-compiler = { path = "../needware-compiler", version = "=2026.10.0" }
needware-runtime = { path = "../needware-runtime", version = "=2026.10.0" }
needware-storage = { path = "../needware-storage", version = "=2026.10.0" }
needware-capabilities = { path = "../needware-capabilities", version = "=2026.10.0" }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal"] }
serde_json.workspace = true
hex.workspace = true
[dev-dependencies]
tempfile = "3"
[lints]
workspace = true
