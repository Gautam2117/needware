# Frontend compatibility candidate; production services require separate acceptance.
[build]
  command = "sh scripts/build-netlify.sh"
  publish = "apps/web/.next"

[functions]
  directory = "infra/netlify/functions"

[functions."mail-retry"]
  schedule = "*/15 * * * *"

[build.environment]
  NODE_VERSION = "24.21.0"
  PNPM_VERSION = "11.5.3"
  NEXT_TELEMETRY_DISABLED = "1"
  CARGO_BUILD_JOBS = "2"

[[plugins]]
  package = "@netlify/plugin-nextjs"
